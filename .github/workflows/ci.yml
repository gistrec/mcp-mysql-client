name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # test:dist rebuilds dist and drives the built server over stdio; no
      # database is needed — every test runs offline.
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # A hung client is exactly what these tests guard against; a hang must
    # fail the job, not hold the runner for six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - db: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.db }}
        env:
          # The MariaDB image accepts the MYSQL_* names as aliases.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: root
      MYSQL_DB: e2e
      ASKADS_TELEMETRY: "0"
    name: e2e (${{ matrix.db }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
